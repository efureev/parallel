version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - prealloc
    - unconvert
    - whitespace
    - wsl_v5
  settings:
    depguard:
      # Правила слоёв из docs/UPGRADE-SPEC.md §3. Без автоматической проверки
      # они разъезжаются за пару месяцев — это наблюдаемая история этого репозитория.
      rules:
        flow:
          list-mode: lax
          files: ['**/internal/flow/**']
          deny:
            - pkg: github.com/efureev/parallel/internal
              desc: 'домен не зависит ни от одного другого слоя'
        buildinfo:
          list-mode: lax
          files: ['**/internal/buildinfo/**']
          deny:
            - pkg: github.com/efureev/parallel/internal
              desc: 'метаданные сборки не зависят ни от чего'
        config:
          list-mode: lax
          files: ['**/internal/config/**']
          deny:
            - pkg: github.com/efureev/parallel/internal/runner
              desc: 'config → только flow'
            - pkg: github.com/efureev/parallel/internal/ui
              desc: 'config → только flow'
            - pkg: github.com/efureev/parallel/internal/cli
              desc: 'config → только flow'
        ui:
          list-mode: lax
          files: ['**/internal/ui/**']
          deny:
            - pkg: github.com/efureev/parallel/internal/config
              desc: 'ui не знает о разборе конфигурации'
            - pkg: github.com/efureev/parallel/internal/runner
              desc: 'ui не знает о процессах'
            - pkg: github.com/efureev/parallel/internal/cli
              desc: 'ui не знает о слое запуска'
        runner:
          list-mode: lax
          files: ['**/internal/runner/**']
          deny:
            - pkg: github.com/efureev/parallel/internal/config
              desc: 'runner не знает о YAML'
            - pkg: github.com/efureev/parallel/internal/cli
              desc: 'runner не знает о слое запуска'
    dupl:
      threshold: 100
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print(|ln))(# it looks like a forgotten debugging printing call)?$
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    godot:
      scope: declarations
      capital: false
    lll:
      line-length: 120
    misspell:
      locale: US
    nolintlint:
      require-specific: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - gochecknoglobals
          - gocognit
          - scopelint
          - wsl_v5
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

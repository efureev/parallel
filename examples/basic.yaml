# Минимальный рабочий пример: две независимые цепочки.
#
# Запуск:  parallel -f examples/basic.yaml
#
# Всё, что здесь используется, есть в любой системе, поэтому пример работает
# из коробки и без правки путей.

commands:
  # Цепочка из двух команд. Обе без pipe, значит выполняются последовательно
  # и в том порядке, в каком записаны. Вывод печатается блоком после завершения.
  greeting:
    hello:
      cmd: [ 'echo', 'hello from the first chain' ]
    listing:
      cmd: [ 'ls', '-la' ]

  # Эта цепочка работает параллельно предыдущей.
  # pipe: true — вывод показывается построчно, сразу по мере появления.
  ticker:
    countdown:
      pipe: true
      cmd: [ 'sh', '-c', 'for i in 3 2 1; do echo "tick $i"; sleep 1; done' ]
      format:
        cmdName: '%CMD_NAME%'

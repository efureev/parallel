# Пример со всеми возможностями схемы конфигурации.
#
# Запуск:  parallel -f examples/full.yaml
#
# Показывает: смешение pipe и не-pipe команд в одной цепочке, рабочий каталог,
# переменные окружения, отключение команды, строковую форму и docker-режим.

# failFast: false   # не останавливать соседние цепочки при отказе одной из них;
                    # то же самое даёт флаг -keep-going
# envFile: .env     # общие переменные для всех команд; можно списком файлов
# maxParallel: 4    # не запускать больше N цепочек разом; то же даёт флаг -jobs

commands:
  # Смешанная цепочка. Не-pipe команды идут последовательно, pipe-команды
  # стартуют сразу и работают параллельно с ними; цепочка ждёт всех.
  app:
    migrate:
      cmd: [ 'echo', 'running migrations' ]

    serve:
      pipe: true
      # timeout: 30s   # снять команду, если не уложилась; то же для всех сразу даёт -timeout
      # restart: on-failure   # поднимать заново после отказа
      # restartAttempts: 5    # 0 или не задано — без ограничения
      # restartDelay: 1s      # стартовая задержка, дальше удваивается
      # envFile: .env.api     # переменные только этой команды, поверх общих
      cmd: [ 'sh', '-c', 'for i in 1 2 3; do echo "serving request $i"; sleep 1; done' ]
      format:
        cmdName: '%CMD_NAME%'

    health-check:
      pipe: true
      cmd: [ 'sh', '-c', 'sleep 2; echo "health: ok"' ]

  # Переменные окружения и рабочий каталог.
  #
  # env дополняет окружение, с которым запущен сам parallel, а не заменяет его:
  # PATH и прочее перечислять не нужно. При совпадении ключей побеждает
  # значение из конфигурации.
  worker:
    env-demo:
      pipe: true
      cmd: [ 'sh', '-c', 'echo "APP_ENV=$APP_ENV PORT=$PORT"; pwd' ]
      dir: '/tmp'
      env:
        APP_ENV: development
        PORT: '8080'

  # disable: команда остаётся в конфигурации и видна в предпросмотре Flow,
  # но не запускается.
  optional:
    disabled-command:
      disable: true
      cmd: [ 'echo', 'этого вывода не будет' ]

    # Docker-режим: parallel сам собирает команду docker. Такие команды всегда
    # выполняются как pipe: true. Отключено, чтобы пример не требовал докера.
    nginx:
      disable: true
      docker:
        image:
          name: 'nginx'
          tag: 'alpine'
          # pull: 'always'        # по умолчанию не указывается
        ports: [ '127.0.0.1:8080:80' ]
        # volumes: [ './site:/usr/share/nginx/html' ]  # ./ и ../ разрешаются от конфигурации
        # network: 'app-net'
        # args: [ 'nginx-debug', '-g', 'daemon off;' ]  # команда КОНТЕЙНЕРА, после образа
        # removeAfterAll: false   # по умолчанию добавляется --rm
        # cmd: 'exec'             # подкоманда САМОГО docker, не команда контейнера

  # Зависимость между цепочками. `needs` — зарезервированное имя внутри цепочки:
  # все остальные ключи там считаются именами команд.
  gate:
    listener:
      pipe: true
      run: 'echo "gate: opening"; sleep 1; echo "gate: READY"; sleep 1'
      ready:
        # Готовность по строке в выводе. Ещё бывают tcp: 'host:port'
        # и exec: [ 'pg_isready' ] — ровно одно условие на команду.
        logLine: 'gate: READY'
        timeout: 10s

  after-gate:
    needs: [ gate ]
    greet:
      pipe: true
      run: 'echo "started only after gate became ready"'

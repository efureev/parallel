name: Build binaries

on:
  workflow_dispatch: { }
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            suffix: linux.x64
            ext: ''
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            suffix: linux.arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            suffix: darwin.x64
            ext: ''
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            suffix: darwin.arm64
            ext: ''
          - goos: windows
            goarch: amd64
            runner: windows-latest
            suffix: windows.x64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Версия тулчейна берётся только из go.mod: при одновременно заданном
      # go-version он перекрывает go-version-file, и релизные бинарники
      # собирались бы не тем Go, который объявлен минимальным.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compute version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            # Use git describe or default to dev
            if v=$(git describe --tags --always --dirty 2>/dev/null); then
              VERSION="$v"
            else
              VERSION="dev"
            fi
          fi
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          APP=parallel
          LD_FLAGS="-s -w \
            -X github.com/efureev/parallel/internal/buildinfo.Version=${{ steps.meta.outputs.version }} \
            -X github.com/efureev/parallel/internal/buildinfo.Commit=${{ steps.meta.outputs.commit }} \
            -X github.com/efureev/parallel/internal/buildinfo.Date=${{ steps.meta.outputs.date }} \
            -X github.com/efureev/parallel/internal/buildinfo.BuiltBy=github-actions"
          mkdir -p build
          OUT="build/${APP}.${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath -ldflags "$LD_FLAGS" -o "$OUT" ./cmd/parallel
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Путь к переменным версии зашит строкой в -ldflags и компилятором не проверяется:
      # переименование или перенос internal/buildinfo соберётся молча, а метаданные
      # окажутся пустыми. Этот шаг делает такой отказ шумным.
      - name: Smoke-check version metadata
        # Только нативная сборка: кросс-скомпилированный бинарник на раннере не запустится.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          out=$("$OUT" -v 2>&1)
          echo "$out"
          echo "$out" | grep -q "Version:   ${{ steps.meta.outputs.version }}" \
            || { echo "::error::version not injected via ldflags"; exit 1; }
          echo "$out" | grep -q "Commit:    ${{ steps.meta.outputs.commit }}" \
            || { echo "::error::commit not injected via ldflags"; exit 1; }
          echo "$out" | grep -q "Built by:  github-actions" \
            || { echo "::error::builder not injected via ldflags"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: parallel-${{ steps.meta.outputs.version }}-${{ matrix.suffix }}
          path: ${{ env.OUT }}
      - name: Display structure of uploaded files
        shell: bash
        run: ls -R
      - name: Display dist path
        shell: bash
        run: echo ${{ env.OUT }}

  docker:
    name: Docker image
    # Тот же тег, что и у релиза: образ — часть поставки, а не отдельный артефакт.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest не должен указывать на предрелиз: тег с суффиксом после дефиса
      # публикуется только под своей версией. Та же логика, что и у pre-release
      # в job release ниже.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Display structure of downloaded files
        run: ls -R

      # Тег с суффиксом после дефиса (v1.2.0-rc1, v2.0.0-beta.1) — предрелиз
      # по SemVer, и публиковать его как обычный релиз нельзя: он встал бы
      # в GitHub как «latest», и `go install ...@latest` начал бы отдавать
      # release candidate всем подряд.
      #
      # Собирать и публиковать rc при этом надо: артефакты нужны именно для
      # того, чтобы его проверить. Поэтому не условие на job, а флаг предрелиза.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/parallel.*

name: Test

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-leaks:
    name: GitLeaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: gacts/gitleaks@v1 # Action page: <https://github.com/gacts/gitleaks>

  lint:
    name: Golang-CI (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      # v2.9 — первая версия, собранная на Go 1.26. Более ранние отказываются
      # запускаться: «the Go language version used to build golangci-lint is lower
      # than the targeted Go version». Поднимая директиву go в go.mod, проверь,
      # что версия здесь и в docker-compose.yml собрана тем же Go или новее.
      - uses: golangci/golangci-lint-action@v9 # Action page: <https://github.com/golangci/golangci-lint-action>
        with: { version: v2.12 }

  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod' # single source of truth for the toolchain version
      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test
        run: go test -v -race -shuffle=on ./...

  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golang/govulncheck-action@v1 # Action page: <https://github.com/golang/govulncheck-action>
        with:
          go-version-file: 'go.mod'

  fuzz:
    name: Fuzz config parsing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # Короткий прогон на каждый push: разбор конфигурации — единственное
      # место, куда попадают недоверенные данные, и паника там означает
      # stack trace вместо ошибки с указанием строки. Длинные прогоны
      # запускаются руками; найденное падение приезжает файлом в
      # testdata/fuzz/ и коммитится, иначе тот же вход придётся искать заново.
      - name: Fuzz parsers
        run: |
          set -euo pipefail
          for target in FuzzUnmarshal FuzzParseDotEnv FuzzExpand; do
            echo "::group::$target"
            go test ./internal/config/ -run "^$target$" -fuzz "^$target$" -fuzztime 30s
            echo "::endgroup::"
          done

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
#      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Update coverage report
        uses: ncruces/go-coverage-report@main
        with:
          report: 'true'
          chart: 'true'
          amend: 'true'
        # Публикация отчёта пишет в wiki репозитория и может падать по правам
        # (например, в форках). Падение не должно валить сборку.
        continue-on-error: true
